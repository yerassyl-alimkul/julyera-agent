<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FBFBFA; color: #17181C; font-family: 'Onest', system-ui, sans-serif">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0 20px">
<button aria-label="Меню" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
</button>
<div style="display: flex; gap: 8px">
<button aria-label="Поиск" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
</button>
<button aria-label="Фильтры по категории и приоритету" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
</button>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0 20px">
<h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em">Октябрь 2026</h1>
<div style="display: flex; gap: 8px">
<button aria-label="Предыдущий месяц" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M14.5 6l-6 6 6 6"/></svg>
</button>
<button aria-label="Следующий месяц" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9.5 6l6 6-6 6"/></svg>
</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 14px 20px 0 20px">
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Пн</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Вт</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Ср</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Чт</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Пт</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Сб</span>
<span style="text-align: center; font-size: 12px; font-weight: 500; color: #5D5F69">Вс</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 8px 20px 0 20px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button onClick="{{ c.pick }}" aria-label="{{ c.aria }}" style="height: 50px; box-sizing: border-box; padding: 6px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 14px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">
<span style="font-size: 15px; font-weight: 600">{{c.num}}</span>
<span style="min-height: 12px; font-size: 11px; font-weight: 600; color: {{c.countColor}}">{{c.countText}}</span>
</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 0 20px; overflow: hidden">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 16px; font-weight: 600">{{heading}}</span>
<span style="font-size: 13px; color: #5D5F69">{{headingCount}}</span>
</div>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 4px; padding: 22px 20px; border: 1.5px dashed #D9D9D3; border-radius: 18px; text-align: center; font-size: 15px; color: #5D5F69">На этот день задач нет</div>
</sc-if>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 18px; background: {{t.bg}}">
<span style="flex: 0 0 42px; font-size: 13px; font-weight: 600">{{t.time}}</span>
<span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.25">{{t.title}}</span>
<div style="position: relative; flex: 0 0 auto; height: 18px; display: flex; align-items: flex-end; gap: 3px">
<span style="width: 4px; height: 8px; border-radius: 2px; background: {{t.p1}}"></span>
<span style="width: 4px; height: 13px; border-radius: 2px; background: {{t.p2}}"></span>
<span style="width: 4px; height: 18px; border-radius: 2px; background: {{t.p3}}"></span>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{t.priorityText}}</span>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px 20px 28px 20px; background: #FBFBFA; border-top: 1px solid #EFEFEA">
<nav aria-label="Разделы" style="flex: 1; height: 60px; box-sizing: border-box; display: flex; gap: 4px; padding: 6px; border-radius: 30px; background: #17181C">
<button style="flex: 1; min-width: 44px; padding: 0; border: none; border-radius: 24px; background: transparent; color: #D5D6DC; font-size: 14px; font-weight: 500">Задачи</button>
<button style="flex: 1; min-width: 44px; padding: 0; border: none; border-radius: 24px; background: #FFFFFF; color: #17181C; font-size: 14px; font-weight: 600">Календарь</button>
<button style="flex: 1; min-width: 44px; padding: 0; border: none; border-radius: 24px; background: transparent; color: #D5D6DC; font-size: 14px; font-weight: 500">Заметки</button>
</nav>
<button aria-label="Добавить задачу" style="flex: 0 0 60px; width: 60px; height: 60px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #557546; color: #FFFFFF">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel == null ? 6 : st.sel;
    const TODAY = 6;

    const CATS = {
      Work: '#E2D47E',
      UniMe: '#DCE5FB',
      Study: '#85AACB',
      Personal: '#A9C89D'
    };
    const PRIO = { High: 3, Mid: 2, Low: 1 };
    const PRIO_TEXT = { High: 'Приоритет: высокий', Mid: 'Приоритет: средний', Low: 'Приоритет: низкий' };

    const TASKS = {
      1: [
        { time: '12:00', title: 'Оплатить интернет', cat: 'Personal', prio: 'Low' }
      ],
      2: [
        { time: '10:00', title: 'Лекция по статистике', cat: 'UniMe', prio: 'Mid' },
        { time: '19:00', title: 'Практика по SQL', cat: 'Study', prio: 'Low' }
      ],
      5: [
        { time: '10:00', title: 'Прочитать конспект лекции', cat: 'UniMe', prio: 'Mid' },
        { time: '18:30', title: 'Тренировка', cat: 'Personal', prio: 'Low' }
      ],
      6: [
        { time: '09:00', title: 'Сдать домашку по кластеризации', cat: 'UniMe', prio: 'High' },
        { time: '12:00', title: 'Покушать в мензе', cat: 'Personal', prio: 'Mid' },
        { time: '15:30', title: 'Подготовить отчёт по проекту', cat: 'Work', prio: 'Mid' },
        { time: '19:00', title: 'Практика по SQL', cat: 'Study', prio: 'Low' },
        { time: '21:00', title: 'Протестировать микрофон', cat: 'Personal', prio: 'High' }
      ],
      7: [
        { time: '14:00', title: 'Созвон по проекту', cat: 'Work', prio: 'High' }
      ],
      8: [
        { time: '09:00', title: 'Семинар по статистике', cat: 'UniMe', prio: 'Mid' },
        { time: '13:00', title: 'Забрать посылку', cat: 'Personal', prio: 'Low' },
        { time: '20:00', title: 'Итальянский, 30 минут', cat: 'Study', prio: 'Mid' }
      ],
      10: [
        { time: '11:00', title: 'Уборка в квартире', cat: 'Personal', prio: 'Low' }
      ],
      12: [
        { time: '09:00', title: 'Планёрка', cat: 'Work', prio: 'High' },
        { time: '16:00', title: 'Сдать черновик отчёта', cat: 'UniMe', prio: 'Mid' }
      ],
      15: [
        { time: '09:00', title: 'Дедлайн по проекту', cat: 'Work', prio: 'High' },
        { time: '13:00', title: 'Обед с группой', cat: 'Personal', prio: 'Low' },
        { time: '18:00', title: 'Повторить кластеризацию', cat: 'Study', prio: 'Mid' }
      ],
      22: [
        { time: '11:00', title: 'Записаться к врачу', cat: 'Personal', prio: 'Mid' }
      ],
      27: [
        { time: '09:30', title: 'Планёрка', cat: 'Work', prio: 'High' },
        { time: '17:00', title: 'Сдать итоговую работу', cat: 'UniMe', prio: 'High' }
      ]
    };

    const plural = (n) => {
      if (n === 0) return 'нет задач';
      const a = n % 10;
      const b = n % 100;
      if (a === 1 && b !== 11) return n + ' задача';
      if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' задачи';
      return n + ' задач';
    };

    // Сетка с понедельника: 1 октября 2026 это четверг, перед ним три дня сентября (28, 29, 30).
    const cells = [];
    for (let i = 0; i < 35; i++) {
      const d = i - 2;
      let num = d;
      let month = 'октября';
      let inMonth = true;
      if (d < 1) { num = 30 + d; month = 'сентября'; inMonth = false; }
      else if (d > 31) { num = d - 31; month = 'ноября'; inMonth = false; }
      const list = inMonth ? (TASKS[num] || []) : [];
      const n = list.length;
      const active = inMonth && num === sel;
      const isToday = inMonth && num === TODAY;
      cells.push({
        num: String(num),
        countText: n > 0 ? String(n) : '',
        aria: num + ' ' + month + ', ' + plural(n),
        bg: active ? '#17181C' : (inMonth ? '#FFFFFF' : 'transparent'),
        border: active ? '#17181C' : (isToday ? '#557546' : (inMonth ? '#E6E6E1' : 'transparent')),
        fg: active ? '#FFFFFF' : (inMonth ? '#17181C' : '#6B6D76'),
        countColor: active ? '#FFFFFF' : '#5D5F69',
        pick: inMonth ? () => this.setState({ sel: num }) : () => {}
      });
    }

    const list = TASKS[sel] || [];
    const on = '#17181C';
    const off = 'rgba(23, 24, 28, 0.18)';
    const tasks = list.map((t) => {
      const level = PRIO[t.prio];
      return {
        time: t.time,
        title: t.title,
        bg: CATS[t.cat],
        p1: level >= 1 ? on : off,
        p2: level >= 2 ? on : off,
        p3: level >= 3 ? on : off,
        priorityText: PRIO_TEXT[t.prio]
      };
    });

    return {
      cells: cells,
      heading: sel + ' октября',
      headingCount: plural(list.length),
      tasks: tasks,
      isEmpty: tasks.length === 0
    };
  }
}
</script>
</body>
</html>
