<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Изменить задачу</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FBFBFA; color: #17181C; font-family: 'Onest', system-ui, sans-serif">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0 20px">
<button aria-label="Закрыть без сохранения" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #E6E6E1; border-radius: 14px; background: #FFFFFF; color: #17181C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 600; font-size: 18px; line-height: 1.2">Изменить задачу</h1>
<div style="width: 44px; height: 44px"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 0 20px">

<section style="display: flex; flex-direction: column; gap: 10px">
<label for="title-field" style="font-size: 14px; font-weight: 600; color: #5D5F69">Задача</label>
<textarea id="title-field" style="width: 100%; height: 96px; box-sizing: border-box; padding: 14px 16px; border: 1.5px solid #17181C; border-radius: 18px; background: #FFFFFF; color: #17181C; font-family: inherit; font-size: 18px; line-height: 1.35; resize: none; outline: none">Сдать домашку по кластеризации</textarea>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #5D5F69">Категория</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 22px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: #17181C; font-size: 15px; font-weight: {{c.weight}}">
<span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #17181C; background: {{c.dot}}"></span>
<span>{{c.label}}</span>
</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #5D5F69">Приоритет</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{prios}}" as="p" hint-placeholder-count="3">
<button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 22px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: #17181C; font-size: 15px; font-weight: {{p.weight}}">
<span style="display: flex; align-items: flex-end; gap: 2px; height: 14px">
<span style="width: 3px; height: 6px; border-radius: 1.5px; background: {{p.b1}}"></span>
<span style="width: 3px; height: 10px; border-radius: 1.5px; background: {{p.b2}}"></span>
<span style="width: 3px; height: 14px; border-radius: 1.5px; background: {{p.b3}}"></span>
</span>
<span>{{p.label}}</span>
</button>
</sc-for>
</div>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #5D5F69">Дедлайн</h2>
<div style="display: flex; gap: 8px">
<div style="flex: 1.6">
<label for="deadline-date" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Дата дедлайна</label>
<input id="deadline-date" type="text" value="Вт, 6 октября 2026" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #E6E6E1; border-radius: 16px; background: #FFFFFF; color: #17181C; font-family: inherit; font-size: 16px; outline: none">
</div>
<div style="flex: 1">
<label for="deadline-time" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Время дедлайна</label>
<input id="deadline-time" type="text" value="09:00" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #E6E6E1; border-radius: 16px; background: #FFFFFF; color: #17181C; font-family: inherit; font-size: 16px; outline: none">
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<label for="tags-field" style="font-size: 14px; font-weight: 600; color: #5D5F69">Теги (через запятую)</label>
<input id="tags-field" type="text" value="экзамен, домашка" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #E6E6E1; border-radius: 16px; background: #FFFFFF; color: #17181C; font-family: inherit; font-size: 16px; outline: none">
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #5D5F69">Шаги</h2>
<span style="font-size: 13px; color: #5D5F69">{{stepsCount}}</span>
</div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="min-height: 48px; display: flex; align-items: center; gap: 4px">
<button onClick="{{ s.toggle }}" aria-label="{{ s.checkLabel }}" style="flex: 0 0 44px; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: transparent">
<span style="width: 22px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #17181C; background: {{s.checkBg}}">
<svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="stroke: {{s.checkStroke}}; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</span>
</button>
<span style="flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; text-decoration: {{s.deco}}; color: {{s.color}}">{{s.text}}</span>
<button onClick="{{ s.remove }}" aria-label="{{ s.removeLabel }}" style="flex: 0 0 44px; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #5D5F69">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
</sc-for>
<div style="margin-top: 4px">
<label for="step-field" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Новый шаг</label>
<input id="step-field" type="text" placeholder="+ добавить шаг" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 16px; border: 1.5px dashed #D9D9D3; border-radius: 16px; background: transparent; color: #17181C; font-family: inherit; font-size: 16px; outline: none">
</div>
</section>

<button style="width: 100%; height: 52px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid #B3261E; border-radius: 18px; background: transparent; color: #B3261E; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>
Удалить задачу
</button>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 28px 20px; background: #FBFBFA; border-top: 1px solid #EFEFEA">
<button style="width: 100%; height: 60px; padding: 0; border: none; border-radius: 22px; background: #557546; color: #FFFFFF; font-size: 16px; font-weight: 600">Сохранить</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cat = st.cat == null ? 3 : st.cat;
    const prio = st.prio == null ? 0 : st.prio;
    const steps = st.steps || [
      { text: 'Подготовить данные', done: true },
      { text: 'Запустить k-means', done: true },
      { text: 'Оформить выводы', done: false }
    ];

    const INK = '#17181C';
    const WHITE = '#FFFFFF';
    const LINE = '#E6E6E1';
    const BAR_OFF = 'rgba(23, 24, 28, 0.18)';

    const CATS = [
      { label: 'Study', color: '#85AACB' },
      { label: 'Work', color: '#E2D47E' },
      { label: 'Personal', color: '#A9C89D' },
      { label: 'UniMe', color: '#DCE5FB' }
    ];
    const PRIOS = [
      { label: 'High', level: 3 },
      { label: 'Mid', level: 2 },
      { label: 'Low', level: 1 }
    ];

    const cats = CATS.map((c, i) => {
      const on = i === cat;
      return {
        label: c.label,
        on: on,
        dot: c.color,
        bg: on ? c.color : WHITE,
        border: on ? INK : LINE,
        weight: on ? 600 : 500,
        pick: () => this.setState({ cat: i })
      };
    });

    const prios = PRIOS.map((p, i) => {
      const on = i === prio;
      return {
        label: p.label,
        on: on,
        b1: p.level >= 1 ? INK : BAR_OFF,
        b2: p.level >= 2 ? INK : BAR_OFF,
        b3: p.level >= 3 ? INK : BAR_OFF,
        bg: on ? '#EFEFEA' : WHITE,
        border: on ? INK : LINE,
        weight: on ? 600 : 500,
        pick: () => this.setState({ prio: i })
      };
    });

    const stepRows = steps.map((s, i) => ({
      text: s.text,
      checkBg: s.done ? INK : 'transparent',
      checkStroke: s.done ? WHITE : 'transparent',
      deco: s.done ? 'line-through' : 'none',
      color: s.done ? '#5D5F69' : INK,
      checkLabel: (s.done ? 'Снять отметку: ' : 'Отметить выполненным: ') + s.text,
      removeLabel: 'Удалить шаг: ' + s.text,
      toggle: () => this.setState({ steps: steps.map((x, k) => k === i ? { text: x.text, done: !x.done } : x) }),
      remove: () => this.setState({ steps: steps.filter((x, k) => k !== i) })
    }));

    const doneCount = steps.filter((s) => s.done).length;

    return {
      cats: cats,
      prios: prios,
      steps: stepRows,
      stepsCount: doneCount + ' из ' + steps.length
    };
  }
}
</script>
</body>
</html>
